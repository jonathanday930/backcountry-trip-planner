# fly.toml app configuration file generated for backcountry-trip-planner on 2026-07-15T00:45:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backcountry-trip-planner'
primary_region = 'iad'

[build]

[env]
  PERSIST_DIR = '/data'
  PORT = '3001'
  SESSION_COOKIE_SECURE = 'true'

[[mounts]]
  source = 'backcountry_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
